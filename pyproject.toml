[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentos"
version = "0.1.0"
description = "A per-channel Discord ↔ Claude agent relay with Obsidian-as-memory, built on the Claude Agent SDK."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "AgentOS contributors" },
]
keywords = ["claude", "anthropic", "agent", "discord", "obsidian", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "claude-agent-sdk>=0.1.0",
    "discord.py>=2.4.0",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0.1",
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
dashboard = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/dhruvadhia1/AgentOS"
Issues = "https://github.com/dhruvadhia1/AgentOS/issues"

[tool.setuptools]
py-modules = [
    "agent_loader",
    "agent_tools",
    "approval_gate",
    "bot",
    "config",
    "cron_trigger",
    "dashboard",
    "dashboard_edit",
    "events",
    "relay",
    "save_marker",
    "tasks",
    "tasks_routes",
    "transcribe",
    "web_chat",
]
