# Global relay config. Per-agent config lives in agents/<name>/agent.yaml.

vault_path_env: VAULT_PATH           # resolved from .env at runtime
guild_id_env: DISCORD_GUILD_ID

# Defaults applied to every agent unless overridden in agent.yaml.
defaults:
  model: null                         # null = let CLI pick (subscription default)
  fallback_model: claude-sonnet-4-6   # if Opus rate-limits or 5xxs, fall back
  permission_mode: acceptEdits
  max_turns: 20
  # Isolate each agent's CLI subprocess from ~/.claude/settings.json — the
  # project-layer (repo's .claude) is enough. Prevents your personal Claude
  # Code hooks/MCP from leaking into agent runs.
  setting_sources: [project]
  allowed_tools:
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    - Bash
    - WebFetch
    - WebSearch
  disallowed_tools: []
  allow_bots: true                    # accept messages authored by other bots (cross-agent comms)
  # Extra directories agents can Read/Write beyond cwd (the vault).
  # The relay dir is needed so agents can draft task files under
  # agents/<self>/tasks/ for the managed cron installer.
  add_dirs:
    - /Users/celainc/Developers/ClaudeAgentSDK/discord-relay
  # Cap for agent-to-agent message chains. A hop chain of N means up to
  # N+1 messages total (root human prompt + N agent bounces). 3 is a
  # conservative default that prevents runaway loops but allows real
  # two-round-trip collaboration.
  max_hops: 3
  # Extended thinking. "adaptive" lets the model decide when to think;
  # trivial tasks stay fast, non-trivial ones surface a ThinkingBlock so
  # the operator can see reasoning live in Discord. Per-agent override
  # available in agent.yaml.
  thinking: adaptive

# Streaming behaviour for live Discord message edits.
streaming:
  edit_interval_seconds: 1.2          # how often to push an edit to Discord
  max_message_length: 1900            # leave room under Discord's 2000-char cap
  thinking_indicator: "…"             # shown in the initial placeholder reply
