name: main
channel_id: "1469505325102006490"   # #virtual-ceo-cto-dhruv / Vayu main (primary)
# NOTE: #research-labs (1477129158114152570) used to be here as an extra
# channel for Vayu. Since then, `research-labs` has grown into a full
# standalone agent with its own persona (bioRxiv MCP, research brief
# cadence). It owns that channel now — see agents/research-labs/.
# Env var holding the outbound webhook URL (defined in .env). Webhook lives
# in the primary channel — that's where cross-agent comms target.
webhook_url_env: MAIN_WEBHOOK_URL

# Using layered files (SOUL/IDENTITY/AGENTS/USER/TOOLS/INTEGRATIONS) —
# no legacy single-file system prompt.
system_prompt_file: ""

# Optional: list of skill markdown files appended to the system prompt.
skills:
  - ../../shared/skills/dev-browser.md

# Tools on top of the defaults in config.yaml.
allowed_tools: []
disallowed_tools: []

# Optional per-agent overrides (otherwise inherits config.yaml/defaults).
# model: claude-opus-4-6
# permission_mode: acceptEdits
# max_turns: 30

# Whether to accept messages authored by other bots (cross-agent comms).
allow_bots: true
effort: high

# MCP servers specific to this agent. Example:
# mcp_servers:
#   obsidian:
#     type: stdio
#     command: npx
#     args: ["-y", "@modelcontextprotocol/server-obsidian"]
mcp_servers: {}

# Scoped specialists Vayu can spawn via the Task tool. See shared/SUBAGENTS.md.
subagents:
  research:
    description: "Focused research subagent — one question, sourced answer."
    prompt: |
      You are a research specialist invoked by Vayu. Answer ONE question
      in under 200 words with 3 bullets max and source links where
      possible. No filler. No "based on my search". Lead with the answer.
    tools: [WebSearch, WebFetch, Read, Grep, Glob]
    model: claude-haiku-4-5-20251001
    max_turns: 5
  synthesizer:
    description: "Distill a pile of notes or trajectories into a crisp summary."
    prompt: |
      You synthesise. Given input (session logs, trajectories, notes),
      produce a 3-section summary: what happened, what matters, what to
      do next. Terse, sourced, no hedging. Under 250 words.
    tools: [Read, Glob, Grep]
    model: claude-sonnet-4-6
    max_turns: 3
