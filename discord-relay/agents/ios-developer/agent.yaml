# Template — copy to agents/<name>/ and fill in.
name: ios-developer
channel_id: "1470499341763608681"
webhook_url_env: IOS_WEBHOOK_URL
bot_token_env: IOS_BOT_TOKEN   # own Discord identity

# Leave empty to use layered files (SOUL/IDENTITY/AGENTS/USER/TOOLS/INTEGRATIONS).
system_prompt_file: ""

# Skill markdown files appended after the layered prompt.
skills: []

allowed_tools: []
disallowed_tools: []

# Optional overrides:
# model: claude-haiku-4-5-20251001
# permission_mode: acceptEdits
# max_turns: 20

allow_bots: true
effort: high
mcp_servers:
  sentry:
    type: env
    note: Sentry — crash reports, error tracking across iOS, Android, web. Release monitoring.
    env_vars:
      - SENTRY_AUTH_TOKEN
      - SENTRY_ORG
      - SENTRY_PROJECT
    api_base: https://sentry.io/api/0
    api_auth: 'Authorization: Bearer $SENTRY_AUTH_TOKEN'
    api_hints:
      - 'List issues: curl -H "Authorization: Bearer $SENTRY_AUTH_TOKEN" "https://sentry.io/api/0/projects/$SENTRY_ORG/$SENTRY_PROJECT/issues/?statsPeriod=24h"'
      - 'Recent events on an issue: curl -H "Authorization: Bearer $SENTRY_AUTH_TOKEN" "https://sentry.io/api/0/issues/{issue_id}/events/"'
      - 'Project stats: curl -H "Authorization: Bearer $SENTRY_AUTH_TOKEN" "https://sentry.io/api/0/projects/$SENTRY_ORG/$SENTRY_PROJECT/stats/?stat=received&resolution=1d"'
    docs_url: https://sentry.io/settings/account/api/auth-tokens/
env_passthrough:
  - SENTRY_AUTH_TOKEN
  - SENTRY_ORG
env:
  SENTRY_PROJECT: apple-ios
