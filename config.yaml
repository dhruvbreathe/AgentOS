# Global AgentOS config. Per-agent config lives in agents/<name>/agent.yaml.

vault_path_env: VAULT_PATH           # resolved from .env at runtime
guild_id_env: DISCORD_GUILD_ID

# Defaults applied to every agent unless overridden in agent.yaml.
defaults:
  model: claude-opus-4-8              # 2026-07-02: operator directive, Opus across ALL agents (supersedes 2026-07-01 Fable 5). Single source of truth: per-agent model hardcodes removed same day so the whole fleet inherits this line.
  fallback_model: claude-sonnet-4-6   # 2026-07-02: Sonnet 4.6 fallback. Distinct from primary; lite-cron downshift collision handled by cron_trigger guard (2026-06-25).
  permission_mode: acceptEdits
  max_turns: 40                       # was 20 — long exploration chains were getting clipped mid-turn
  # Isolate each agent's CLI subprocess from ~/.claude/settings.json — the
  # project-layer (repo's .claude) is enough. Prevents your personal Claude
  # Code hooks/MCP from leaking into agent runs.
  setting_sources: [project]
  allowed_tools:
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    - Bash
    - WebFetch
    - WebSearch
  disallowed_tools: []
  allow_bots: true                    # accept messages authored by other bots (cross-agent comms)
  # Extra directories agents can Read/Write beyond cwd (the vault).
  # agent_loader automatically prepends the AgentOS project root so agents
  # can draft task files under agents/<self>/tasks/ for the managed
  # scheduler. Add extra absolute paths here for site-specific needs.
  add_dirs: []
  # Safety ceiling on agent-to-agent chain DEPTH. This is no longer the loop
  # guard — cycle detection in agent_tools.py refuses routing to any agent
  # already in the chain (A→B→A blocked at any depth), so legitimate deep
  # fan-outs (Atlas needs Aria AND Ravi, who each need someone else) proceed
  # freely. max_hops only stops pathological runaway depth where every agent
  # is distinct. 8 gives real multi-agent collaboration room while still
  # capping a fan-out gone wrong.
  max_hops: 8
  # Extended thinking. "adaptive" lets the model decide when to think;
  # trivial tasks stay fast, non-trivial ones surface a ThinkingBlock so
  # the operator can see reasoning live in Discord. Per-agent override
  # available in agent.yaml.
  thinking: adaptive
  # Reasoning effort. "max" = ultra-code mode: the model spends the most
  # reasoning it can before acting. Operator directive 2026-07-01 (Fable 5
  # ultra-code). Combined with adaptive thinking this is the max-reasoning
  # coding config. Per-agent override via `effort:` in agent.yaml — noisy
  # ack-only agents can drop to "medium"/"low" to save cost/latency.
  effort: max

  # Exec-approval gate. When a Bash command matches one of these regex
  # patterns, the agent's PreToolUse hook posts an approval request to
  # the agent's channel and waits for a ✅ / ❌ reaction. Timeout →
  # auto-deny. Disable per-agent with `approval: {enabled: false}` in
  # agent.yaml.
  approval:
    enabled: true
    timeout_seconds: 60
    poll_interval_seconds: 2.5
    # A8 (2026-07-01): only this Discord user's ✅/❌ counts. Verified via
    # the relay bot token; without it the gate falls back to any-reaction.
    operator_id: "702395666227265617"   # Dhruv
    dangerous_patterns:
      - '\brm\s+-rf?\b'            # rm -rf anything
      - '\bgit\s+push\s+[^|;&]*--force'
      - '\bgit\s+push\s+[^|;&]*\s-f\b'
      - '\bgit\s+reset\s+--hard\b'
      - '\bgit\s+clean\s+-[a-zA-Z]*f'  # git clean -f / -fd
      - '\blaunchctl\s+(bootout|remove)\b'
      - '\bdiskutil\s+erase\b'
      - '\bmkfs\b'
      - '\bdd\s+if='
      - '\|\s*sudo\b'              # anything piped to sudo
      - '\bcurl\s[^|]*\|\s*(sh|bash|zsh)\b'
      - '\bwget\s[^|]*\|\s*(sh|bash|zsh)\b'
      - '\bkillall\s+[A-Za-z]'
      - '\bshutdown\b'
      - '\breboot\b'
      # Destructive AgentOS operation: rolling back agent state. Always
      # surface for ✅ before executing — the operator deserves to see
      # which checkpoint is about to be applied.
      - '\bcheckpoint_gate(\.py)?\s+restore\b'
      # Add site-specific regex patterns below to protect sensitive files
      # from agent edits. Example: '/path/to/important/file\.md'
    # A2 (2026-07-02): Write/Edit to these paths needs the same ✅ approval
    # as dangerous Bash — closes the file-tool bypass and makes the
    # protections APPROVALS.md documents (DECISIONS.md, .env) actually
    # hold. Regexes match the tool call's file_path.
    protected_paths:
      - 'Company/DECISIONS\.md$'                  # decisions log = sign-off surface
      - '(^|/)\.env(\.[A-Za-z0-9_.-]+)?$'         # secrets
      - '\.claude/settings(\.local)?\.json$'      # permission allowlists
      - 'agents/[^/]+/agent\.yaml$'               # per-agent tools/model/privileges
      - 'ClaudeAgentSDK/config\.yaml$'            # this file — the gate itself

  # Phase-0 session rotation (2026-07-05 orchestration master plan). When a
  # channel session's last post-turn context reading exceeds the ceiling,
  # the next turn starts a FRESH session seeded with a memory handoff
  # (tail of the agent's daily memory files) instead of resuming. Kills the
  # 300-600k context bloat (20% of turns!), restores reasoning quality, and
  # makes session-store mirrors chain-complete from birth. Fail-open.
  session_rotation:
    enabled: true
    max_context_tokens: 150000
    # per_agent: {media: 100000}   # Phase-2: optional earlier rotation for heavy-payload agents

  # Phase-2 memory recall (2026-07-05 masterplan item 8). Before each
  # Discord-relayed turn, memory_recall.py lexically matches the incoming
  # message against Sessions/ (30d), Topics/, Company/FACTS.md,
  # Company/DECISIONS.md + the agent's own daily memory (7d) and prepends
  # the top-k snippets to the prompt. Lexical v1 on purpose — the
  # smart-connections MCP is session-scoped, unreachable from the relay
  # pre-turn. Fail-open; ~0.1ms/query on a 10-min cached index.
  memory_recall:
    enabled: true
    k: 4
    max_chars: 1200
    min_message_chars: 20

  # Phase-2 quality loops (2026-07-05 masterplan item 9). Fleet-default
  # subagents merged into every agent's set (agent.yaml wins on name
  # collision). Inline prompts only — prompt_file would resolve against
  # each agent's own dir. Descriptions carry the usage trigger.
  subagents:
    code-reviewer:
      description: "MUST run before any git push of app/production code: reviews a diff for bugs, security issues, missing error handling. Not for style."
      prompt: |
        You review code diffs before they ship. Flag ONLY real bugs,
        security issues (injection, auth bypass, secret exposure), missing
        error handling on external calls, data-loss risks, obvious
        performance traps. Skip style, naming, formatting. For each finding
        give file:line, what breaks, one-line fix. If clean say clean plus
        the ONE riskiest spot you would watch. Under 250 words.
      tools: [Read, Grep, Glob, Bash]
      model: sonnet
      max_turns: 12
    digest-verifier:
      description: "Run on any digest/report BEFORE posting: verifies every number and claim against its stated source; catches stale metrics and unit errors."
      prompt: |
        You verify a draft digest/report before it posts. For EVERY number
        and factual claim, check it against the stated source (file, API
        output, log). Flag numbers with no source, stale values, unit or
        magnitude errors, percentages that do not recompute, conf:estimate
        figures presented as hard facts. Output VERIFIED or a numbered list
        of problems with the correct value. Under 200 words.
      tools: [Read, Grep, Glob, Bash]
      model: sonnet
      max_turns: 10
    claim-checker:
      description: "Run before sending anything outbound (investor, customer, public) that cites metrics: checks each figure against Company/FACTS.md conf tiers."
      prompt: |
        You check outbound copy against Company/FACTS.md in the vault. For
        each metric or claim in the draft, find the matching FACTS entry and
        report its conf tier and date. Flag figures absent from FACTS,
        conf:estimate or unverified presented as precise facts, stale
        entries, rounding UP beyond the source. Output a table of claim,
        FACTS value, tier, verdict. Under 250 words.
      tools: [Read, Grep, Glob]
      model: sonnet
      max_turns: 8

  # Session transcript mirror (SDK >= 0.2.110 SessionStore). Every session's
  # JSONL is mirrored so transcripts survive the CLI's cleanup sweep and
  # become fork/list/delete-able via the SDK session APIs. Resume
  # materializes from the mirror once a session has been mirrored; sessions
  # that predate the mirror fall through to the CLI's local transcripts
  # (zero-import migration, 2026-07-01).
  # backend: "supabase" = Agent Nervous System project (agents.session_store,
  # env SUPABASE_AGENT_NS_*; falls back to file if env missing, circuit-opens
  # on outage — Supabase down degrades to pre-mirror behavior, never breaks
  # resume). "file" = logs/session_store/<project_key>/.
  # Per-agent opt-out: `session_store: {enabled: false}`.
  session_store:
    enabled: true
    backend: supabase       # 2026-07-01, Dhruv: "Ok go" — was "file"
    dir: logs/session_store # file backend + fallback target
    flush: batched          # "eager" = flush per frame (near-realtime, chattier I/O)

  # Phantom / runaway tool-call loop guard. A PreToolUse hook (runs on
  # EVERY tool, alongside the approval gate) that DENIES a call when the
  # SAME tool is invoked with the byte-for-byte SAME input `threshold`
  # times in a row, or when the tool name is empty/missing/whitespace
  # (the empty-name phantom call). Identical-input repetition is the true
  # loop signal: legitimate fan-out (reading many files, editing many
  # spots) varies its input every call, so the consecutive counter resets
  # and never trips. This aborts a stuck agent in ~5 turns instead of
  # burning all of max_turns. Disable per-agent with
  # `loop_guard: {enabled: false}` in agent.yaml; tune with `threshold`.
  loop_guard:
    enabled: true
    threshold: 5

  # Phase-1 heartbeats (2026-07-05 orchestration master plan). Relay-level
  # scheduler (heartbeat.py) resumes each pilot agent's channel session on a
  # cadence with its HEARTBEAT.md checklist. Output is DISCARDED; posting is
  # an action the agent takes deliberately, so beats stay silent unless
  # something warrants it. An agent must also have agents/<name>/HEARTBEAT.md
  # or it is skipped. Fail-open everywhere; state in logs/heartbeats.json.
  heartbeat:
    enabled: true
    interval_minutes: 240          # per-agent beat cadence
    active_hours: [8, 22]          # local-time window, [start, end)
    agents: [main, project-manager, backend-developer, marketing]

# Save-to-vault gate. Operator reacts `emoji` on any agent message to
# persist the most recent turn (last user prompt + assistant outputs)
# into $VAULT_PATH/Sessions/. The bot reacts `ack_emoji` on success or
# `error_emoji` on failure, so the operator gets visual confirmation
# without leaving Discord. Mirrors the Hermes "save icon" UX.
save:
  enabled: true
  emoji: "💾"
  ack_emoji: "✅"
  error_emoji: "⚠️"
  # Hermes-style auto-react: bot adds its own 💾 to substantive replies so
  # the operator can ✅ to confirm save (or ignore). Off by default — flip
  # on when ready and the bot will mark long/structured replies for one-tap save.
  auto_react: false
  auto_react_min_chars: 500

# Streaming behaviour for live Discord message edits.
streaming:
  edit_interval_seconds: 1.2          # how often to push an edit to Discord
  max_message_length: 1900            # leave room under Discord's 2000-char cap
  thinking_indicator: "…"             # shown in the initial placeholder reply
